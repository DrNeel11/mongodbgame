{% extends 'base.html' %}
{% block content %}
  <h2>Players</h2>
  <ul>
    {% for p in players %}
      <li>
        <a href="/ui/players/{{ p.get('player_id') or p.get('_id') }}">{{ p.get('username') or p.get('name') }}</a>
      </li>
    {% else %}
      <li>No players</li>
    {% endfor %}
  </ul>
{% endblock %}
