<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameBD Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        code { font-family: 'Fira Code', monospace; }
        .gradient-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .gradient-dark { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
        .cmd-card { background: #1a1a2e; border: 1px solid #667eea33; }
        .cmd-card:hover { border-color: #667eea; }
        .sql-code { background: #0f0f1e; color: #a8ff60; font-size: 0.85em; padding: 12px; border-radius: 6px; overflow-x: auto; }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div id="root"></div>

    <script>
        const API_BASE = "http://localhost:8001";
        
        // ==================== ADMIN API DOCUMENTATION ====================
        const ENDPOINTS = {
            "MongoDB Operations": {
                "Players": [
                    { method: "GET", path: "/api/v1/players", desc: "List all players", curl: "curl http://localhost:8001/api/v1/players?skip=0&limit=20" },
                    { method: "POST", path: "/api/v1/players", desc: "Create new player", curl: "curl -X POST http://localhost:8001/api/v1/players -H 'Content-Type: application/json' -d '{\"username\":\"player1\",\"email\":\"player@example.com\",\"platforms\":[\"pc\"]}'" },
                    { method: "GET", path: "/api/v1/players/{player_id}", desc: "Get player by ID", curl: "curl http://localhost:8001/api/v1/players/PLAYER_ID" },
                    { method: "PUT", path: "/api/v1/players/{player_id}", desc: "Update player", curl: "curl -X PUT http://localhost:8001/api/v1/players/PLAYER_ID -H 'Content-Type: application/json' -d '{\"settings\":{\"language\":\"en\"}}'" },
                    { method: "DELETE", path: "/api/v1/players/{player_id}", desc: "Delete player", curl: "curl -X DELETE http://localhost:8001/api/v1/players/PLAYER_ID" },
                    { method: "POST", path: "/api/v1/players/{player_id}/login", desc: "Record login", curl: "curl -X POST http://localhost:8001/api/v1/players/PLAYER_ID/login" },
                ],
                "Games": [
                    { method: "GET", path: "/api/v1/games", desc: "List all games", curl: "curl http://localhost:8001/api/v1/games?skip=0&limit=20" },
                    { method: "POST", path: "/api/v1/games", desc: "Create new game", curl: "curl -X POST http://localhost:8001/api/v1/games -H 'Content-Type: application/json' -d '{\"title\":\"Game Name\",\"publisher\":\"Publisher\",\"platforms\":[\"pc\",\"xbox\"]}'" },
                    { method: "GET", path: "/api/v1/games/{game_id}", desc: "Get game by ID", curl: "curl http://localhost:8001/api/v1/games/GAME_ID" },
                    { method: "PUT", path: "/api/v1/games/{game_id}", desc: "Update game", curl: "curl -X PUT http://localhost:8001/api/v1/games/GAME_ID -H 'Content-Type: application/json' -d '{\"max_players\":100}'" },
                    { method: "DELETE", path: "/api/v1/games/{game_id}", desc: "Delete game", curl: "curl -X DELETE http://localhost:8001/api/v1/games/GAME_ID" },
                ],
                "Statistics": [
                    { method: "GET", path: "/api/v1/stats/{player_id}/{game_id}", desc: "Get player stats for game", curl: "curl http://localhost:8001/api/v1/stats/PLAYER_ID/GAME_ID" },
                    { method: "GET", path: "/api/v1/stats/{player_id}", desc: "Get all stats for player", curl: "curl http://localhost:8001/api/v1/stats/PLAYER_ID" },
                    { method: "POST", path: "/api/v1/stats", desc: "Create stats record", curl: "curl -X POST http://localhost:8001/api/v1/stats -H 'Content-Type: application/json' -d '{\"player_id\":\"ID\",\"game_id\":\"ID\"}'" },
                    { method: "PATCH", path: "/api/v1/stats/{player_id}/{game_id}", desc: "Update stats", curl: "curl -X PATCH http://localhost:8001/api/v1/stats/PLAYER_ID/GAME_ID -H 'Content-Type: application/json' -d '{\"wins\":1,\"kills\":5}'" },
                ],
                "Leaderboards": [
                    { method: "GET", path: "/api/v1/leaderboards", desc: "Get global leaderboard", curl: "curl 'http://localhost:8001/api/v1/leaderboards?limit=50'" },
                    { method: "GET", path: "/api/v1/leaderboards?game_id={game_id}", desc: "Get game-specific leaderboard", curl: "curl 'http://localhost:8001/api/v1/leaderboards?game_id=GAME_ID&limit=50'" },
                ],
                "Matches": [
                    { method: "GET", path: "/api/v1/matches/{match_id}", desc: "Get match details", curl: "curl http://localhost:8001/api/v1/matches/MATCH_ID" },
                    { method: "POST", path: "/api/v1/matches", desc: "Create match record", curl: "curl -X POST http://localhost:8001/api/v1/matches -H 'Content-Type: application/json' -d '{\"game_id\":\"ID\",\"players\":[\"ID1\",\"ID2\"],\"winner_id\":\"ID1\"}'" },
                ],
                "Achievements": [
                    { method: "GET", path: "/api/v1/achievements", desc: "List all achievements", curl: "curl http://localhost:8001/api/v1/achievements" },
                    { method: "GET", path: "/api/v1/players/{player_id}/achievements", desc: "Get player achievements", curl: "curl http://localhost:8001/api/v1/players/PLAYER_ID/achievements" },
                ],
            },
            "Neo4j Graph Operations": {
                "Player Nodes": [
                    { method: "POST", path: "/api/v1/player-nodes", desc: "Create player node", curl: "curl -X POST http://localhost:8001/api/v1/player-nodes -H 'Content-Type: application/json' -d '{\"player_id\":\"ID\",\"username\":\"name\",\"status\":\"online\"}'" },
                    { method: "GET", path: "/api/v1/player-nodes/{player_id}", desc: "Get player node", curl: "curl http://localhost:8001/api/v1/player-nodes/PLAYER_ID" },
                    { method: "PATCH", path: "/api/v1/player-nodes/{player_id}/status", desc: "Update player status", curl: "curl -X PATCH http://localhost:8001/api/v1/player-nodes/PLAYER_ID/status -H 'Content-Type: application/json' -d '{\"status\":\"online\"}'" },
                    { method: "DELETE", path: "/api/v1/player-nodes/{player_id}", desc: "Delete player node", curl: "curl -X DELETE http://localhost:8001/api/v1/player-nodes/PLAYER_ID" },
                ],
                "Friends": [
                    { method: "POST", path: "/api/v1/friends/request", desc: "Send friend request", curl: "curl -X POST http://localhost:8001/api/v1/friends/request -H 'Content-Type: application/json' -d '{\"from_player_id\":\"ID1\",\"to_player_id\":\"ID2\",\"message\":\"Hey!\"}'" },
                    { method: "GET", path: "/api/v1/friends/{player_id}", desc: "Get player's friends", curl: "curl http://localhost:8001/api/v1/friends/PLAYER_ID" },
                    { method: "GET", path: "/api/v1/friends/{player_id}/requests", desc: "Get friend requests", curl: "curl http://localhost:8001/api/v1/friends/PLAYER_ID/requests" },
                    { method: "DELETE", path: "/api/v1/friends/{player_id}/{friend_id}", desc: "Remove friend", curl: "curl -X DELETE http://localhost:8001/api/v1/friends/PLAYER_ID/FRIEND_ID" },
                ],
                "Messaging": [
                    { method: "POST", path: "/api/v1/conversations", desc: "Create conversation", curl: "curl -X POST http://localhost:8001/api/v1/conversations -H 'Content-Type: application/json' -d '{\"conversation_type\":\"direct\",\"participant_ids\":[\"ID1\",\"ID2\"]}'" },
                    { method: "GET", path: "/api/v1/conversations/{player_id}", desc: "Get player's conversations", curl: "curl http://localhost:8001/api/v1/conversations/PLAYER_ID" },
                    { method: "GET", path: "/api/v1/conversations/{conversation_id}/messages", desc: "Get messages in conversation", curl: "curl http://localhost:8001/api/v1/conversations/CONV_ID/messages" },
                    { method: "POST", path: "/api/v1/messages", desc: "Send message", curl: "curl -X POST http://localhost:8001/api/v1/messages -H 'Content-Type: application/json' -d '{\"conversation_id\":\"ID\",\"sender_id\":\"PLAYER_ID\",\"text\":\"Hello\"}'" },
                ],
                "Parties": [
                    { method: "POST", path: "/api/v1/parties", desc: "Create party", curl: "curl -X POST http://localhost:8001/api/v1/parties -H 'Content-Type: application/json' -d '{\"leader_id\":\"ID\",\"game_name\":\"Fortnite\"}'" },
                    { method: "GET", path: "/api/v1/parties/{player_id}", desc: "Get player's parties", curl: "curl http://localhost:8001/api/v1/parties/PLAYER_ID" },
                    { method: "POST", path: "/api/v1/parties/{party_id}/invite", desc: "Invite to party", curl: "curl -X POST http://localhost:8001/api/v1/parties/PARTY_ID/invite -H 'Content-Type: application/json' -d '{\"player_id\":\"ID\"}'" },
                    { method: "DELETE", path: "/api/v1/parties/{party_id}/{player_id}", desc: "Leave party", curl: "curl -X DELETE http://localhost:8001/api/v1/parties/PARTY_ID/PLAYER_ID" },
                ],
                "Clans": [
                    { method: "GET", path: "/api/v1/clans", desc: "List all clans", curl: "curl http://localhost:8001/api/v1/clans" },
                    { method: "POST", path: "/api/v1/clans", desc: "Create clan", curl: "curl -X POST http://localhost:8001/api/v1/clans -H 'Content-Type: application/json' -d '{\"owner_id\":\"ID\",\"clan_name\":\"Clan\",\"description\":\"Desc\"}'" },
                    { method: "GET", path: "/api/v1/clans/{clan_id}", desc: "Get clan details", curl: "curl http://localhost:8001/api/v1/clans/CLAN_ID" },
                    { method: "DELETE", path: "/api/v1/clans/{clan_id}/{player_id}", desc: "Leave clan", curl: "curl -X DELETE http://localhost:8001/api/v1/clans/CLAN_ID/PLAYER_ID" },
                ],
                "Following": [
                    { method: "POST", path: "/api/v1/follow", desc: "Follow player", curl: "curl -X POST http://localhost:8001/api/v1/follow -H 'Content-Type: application/json' -d '{\"follower_id\":\"ID1\",\"following_id\":\"ID2\"}'" },
                    { method: "GET", path: "/api/v1/followers/{player_id}", desc: "Get followers", curl: "curl http://localhost:8001/api/v1/followers/PLAYER_ID" },
                    { method: "DELETE", path: "/api/v1/follow/{follower_id}/{following_id}", desc: "Unfollow", curl: "curl -X DELETE http://localhost:8001/api/v1/follow/FOLLOWER_ID/FOLLOWING_ID" },
                ],
            },
            "System Endpoints": {
                "Health": [
                    { method: "GET", path: "/", desc: "API Root", curl: "curl http://localhost:8001/" },
                    { method: "GET", path: "/health", desc: "Health check", curl: "curl http://localhost:8001/health" },
                    { method: "GET", path: "/docs", desc: "Swagger UI", curl: "Visit http://localhost:8001/docs in browser" },
                    { method: "GET", path: "/admin/health", desc: "Admin health check", curl: "curl http://localhost:8001/admin/health" },
                ],
                "Benchmarks": [
                    { method: "GET", path: "/admin/benchmarks", desc: "Run performance benchmarks", curl: "curl http://localhost:8001/admin/benchmarks" },
                ],
            }
        };

        const app = {
            init() {
                this.render();
            },

            render() {
                const categoryHtml = Object.entries(ENDPOINTS).map(([category, sections]) => `
                    <div class="mb-12">
                        <h2 class="text-3xl font-bold mb-8 text-purple-400">${category}</h2>
                        ${Object.entries(sections).map(([section, endpoints]) => `
                            <div class="mb-8">
                                <h3 class="text-xl font-semibold mb-4 text-gray-300">${section}</h3>
                                <div class="space-y-4">
                                    ${endpoints.map(ep => `
                                        <div class="cmd-card rounded-lg p-6 card-hover">
                                            <div class="flex items-start justify-between mb-3">
                                                <div>
                                                    <span class="inline-block px-3 py-1 rounded text-sm font-semibold mr-2 ${ep.method === 'GET' ? 'bg-blue-500/30 text-blue-300' : ep.method === 'POST' ? 'bg-green-500/30 text-green-300' : ep.method === 'PUT' ? 'bg-yellow-500/30 text-yellow-300' : ep.method === 'PATCH' ? 'bg-cyan-500/30 text-cyan-300' : 'bg-red-500/30 text-red-300'}">
                                                        ${ep.method}
                                                    </span>
                                                    <span class="text-gray-400 text-sm">${ep.path}</span>
                                                </div>
                                            </div>
                                            <p class="text-gray-300 mb-4">${ep.desc}</p>
                                            <pre class="sql-code text-xs mb-2"><code>${ep.curl}</code></pre>
                                            <button onclick="app.copyCurl('${ep.curl.replace(/'/g, "\\'")}')\" class=\"px-3 py-1 text-xs bg-purple-600 hover:bg-purple-700 rounded transition\">Copy cURL</button>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `).join('');

                document.getElementById('root').innerHTML = `
                    <div class="min-h-screen bg-gray-900 gradient-dark">
                        <header class="sticky top-0 z-50 gradient-dark border-b border-purple-500/30">
                            <div class="max-w-7xl mx-auto px-6 py-6">
                                <h1 class="text-4xl font-bold">🎮 GameBD Admin Dashboard</h1>
                                <p class="text-gray-400 mt-2">Complete API Reference & Command Library</p>
                            </div>
                        </header>

                        <main class="max-w-7xl mx-auto px-6 py-12">
                            ${categoryHtml}
                            
                            <div class="mb-12 p-8 rounded-lg bg-blue-500/10 border border-blue-500/30">
                                <h3 class="text-2xl font-bold mb-4 text-blue-400">📖 Quick Tips</h3>
                                <ul class="space-y-2 text-blue-300">
                                    <li>✓ All timestamps are UTC</li>
                                    <li>✓ IDs are MongoDB ObjectIds (24 hex chars) or player/game IDs</li>
                                    <li>✓ Pagination: use <code>skip</code> and <code>limit</code> parameters</li>
                                    <li>✓ Max limit per request: 100 records</li>
                                    <li>✓ Neo4j requires connected graph database for social features</li>
                                    <li>✓ MongoDB Collections: players, games, stats, matches, leaderboards, achievements, sessions, notifications, inventory</li>
                                    <li>✓ Neo4j Nodes: Player, Friends, Messages, Parties, Clans, Followers</li>
                                </ul>
                            </div>
                        </main>
                    </div>
                `;
            },

            copyCurl(curl) {
                navigator.clipboard.writeText(curl).then(() => {
                    alert('cURL command copied to clipboard!');
                });
            }
        };

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
