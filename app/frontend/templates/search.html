{% extends 'base.html' %}
{% block content %}
  <h2>Search Games</h2>
  <form method="get" action="/ui/search">
    <input name="q" value="{{ query or '' }}" placeholder="Search games..." />
    <button type="submit">Search</button>
  </form>

  {% if error %}
    <p style="color:darkred">Error: {{ error }}</p>
  {% endif %}

  <ul>
    {% for g in results %}
      <li>{{ g.get('name') or g.get('title') }} - {{ g.get('description','')[:120] }}</li>
    {% else %}
      <li>No results</li>
    {% endfor %}
  </ul>
{% endblock %}
